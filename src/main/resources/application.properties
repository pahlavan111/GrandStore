spring.application.name=Grand Store

spring.jwt.secret=${JWT_SECRET}
spring.jwt.accessTokenExpiration=7200
spring.jwt.refreshTokenExpiration=604800

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/store
spring.datasource.username=admin
spring.datasource.password=admin

logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
#logging.level.org.flywaydb=DEBUG
#logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.http.converter=TRACE
#logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE